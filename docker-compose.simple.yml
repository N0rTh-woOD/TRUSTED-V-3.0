version: '3.8'

# Simplified docker-compose for quick deployment
# Use this if you don't need the separate nginx container

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trusted-v-backend
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=${MONGO_URL}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - EMERGENT_LLM_KEY=${EMERGENT_LLM_KEY}
      - CORS_ORIGINS=*
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL:-http://localhost:8001}
    container_name: trusted-v-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
